name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/example/visitingcardscanner
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/example/visitingcardscanner/
          cp CardParser.kt app/src/main/java/com/example/visitingcardscanner/
          cp activity_main.xml app/src/main/res/layout/
          cp styles.xml app/src/main/res/values/

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.visitingcardscanner"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.visitingcardscanner"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.camera:camera-camera2:1.4.1")
              implementation("androidx.camera:camera-lifecycle:1.4.1")
              implementation("androidx.camera:camera-view:1.4.1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisitingCardScanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk